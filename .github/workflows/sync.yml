name: Strava sync

# Runs at the top of every hour and on demand.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      debug_date:
        description: "Print lap breakdown for this YYYY-MM-DD (diagnostic)"
        required: false
        default: ""
      days_back:
        description: "One-off: how many days back to sync (blank = default 21)"
        required: false
        default: ""
      debug_splits:
        description: "Print per-km Strava splits for this date or activity id (diagnostic)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull Strava activities
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          DEBUG_LAPS: ${{ github.event.inputs.debug_date }}
          DAYS_BACK_OVERRIDE: ${{ github.event.inputs.days_back }}
          DEBUG_SPLITS: ${{ github.event.inputs.debug_splits }}
        run: python scripts/strava_sync.py

      - name: Commit updated data
        run: |
          git config user.name  "strava-bot"
          git config user.email "actions@github.com"
          git add data/activities.json
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "chore: strava sync $(date -u +%Y-%m-%d)"
            git push
          fi

  # Ash's block app (/ash/). Same Strava API app, her own refresh token.
  # Does nothing until ASH_STRAVA_REFRESH_TOKEN is set as a repository secret.
  sync-ash:
    needs: sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull Ash's Strava activities
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.ASH_STRAVA_REFRESH_TOKEN }}
          DAYS_BACK_OVERRIDE: ${{ github.event.inputs.days_back }}
          OUT_PATH: ash/data/activities.json
        run: |
          if [ -z "$STRAVA_REFRESH_TOKEN" ]; then
            echo "ASH_STRAVA_REFRESH_TOKEN not set yet - skipping Ash's sync."
            exit 0
          fi
          python scripts/strava_sync.py
      - name: Commit Ash's data
        run: |
          git config user.name  "strava-bot"
          git config user.email "actions@github.com"
          git add ash/data/activities.json
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "chore: strava sync (ash) $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi
